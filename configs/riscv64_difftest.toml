# This is a config for Sail RISC-V in 64-bit mode

pc = "PC"

zero_announce_exit = true

default_sizeof = 4

in_program_order = ["sail_barrier"]

[execution_limits]
max_forks_per_branch = 1

# solve-state 默认在代码中仅对 V gather 的四个逐元素热点做局部抽样。
# 本配置将每个热点的实际 fork 次数从代码默认 2 覆盖为 1；一次 fork 已覆盖条件两侧。
#
# Region 配置说明：
# - region 使用半开区间 [start, end)，位置按 (line, column) 比较。
# - 多个 [[execution_limits.regions]] 之间是 OR：IR 位置命中任意一个 region 即可。
# - regions 会同时过滤 branch-local limit 和 loop limit；path fork/depth limit 不受 region 过滤。
# - 一旦显式配置 regions，就会整体替换 solve-state 的代码默认 regions。
# - file 必须与 IR files 表中的路径完全相同；文件不存在时只是不命中，不会报错或 panic。
# - loop region 只能命中带 SourceLoc 的条件回边；无 SourceLoc 的 Goto 回边不会命中源码 region。
#
# 样例一：只对 VV_VRGATHER 的 mask 分支和 idx < VLMAX 分支应用 branch limit。
# 使用时保留上面的 max_forks_per_branch，取消下面两个 region 的注释。
# [[execution_limits.regions]]
# file = "extensions/V/vext_arith_insts.sail"
# start_line = 186
# start_column = 6
# end_line = 192
# end_column = 7
#
# [[execution_limits.regions]]
# file = "extensions/V/vext_arith_insts.sail"
# start_line = 191
# start_column = 20
# end_line = 191
# end_column = 65
#
# 样例二：只限制 vmem_read_addr 中 repeat-until 的条件回边。
# 使用时删除或注释上面的 max_forks_per_branch，再取消下面内容的注释。
# max_backjumps_per_loop = 16
# on_limit_reached = "truncate"
#
# [[execution_limits.regions]]
# file = "sys/vmem_utils.sail"
# start_line = 146
# start_column = 2
# end_line = 171
# end_column = 0
#
# 样例三：在同一组 region 内同时启用 branch 和 loop limit。
# regions 是共享选择器，因此下面两个限制都会作用于所有已配置 region；目前不能为二者分别配置 region 集合。
# 使用时应替换当前 [execution_limits] 中的同名字段，避免 TOML 重复 key。
# max_forks_per_branch = 2
# max_backjumps_per_loop = 32
# call_context_depth = 2
# on_limit_reached = "concretize"
#
# [[execution_limits.regions]]
# file = "extensions/V/vext_arith_insts.sail"
# start_line = 185
# start_column = 20
# end_line = 194
# end_column = 0
#
# [[execution_limits.regions]]
# file = "sys/vmem_utils.sail"
# start_line = 146
# start_column = 2
# end_line = 171
# end_column = 0

[[toolchain]]
name = "macos-riscv64"
os = "macos"
arch = "aarch64"
assembler = "riscv64-elf-as"
objdump = "riscv64-elf-objdump"
nm = "riscv64-elf-nm"
linker = "riscv64-elf-ld"

[[toolchain]]
name = "default"
assembler = "riscv64-linux-gnu-as -march=rv64imac"
objdump = "riscv64-linux-gnu-objdump"
linker = "riscv64-linux-gnu-ld"
nm = "riscv64-linux-gnu-nm"

# Currently not used for RISC-V
[mmu]
page_table_base = "0x300000"
page_size = "4096"
s2_page_table_base = "0x300000"
s2_page_size = "4096"

[threads]
base = "0x80100000"
top = "0x80300000"
stride = "0x10000"

[symbolic_addrs]
base = "0x80310000"
top = "0x80410000"
stride = "0x10"

[registers]

[registers.defaults]
"__isla_vector_gpr" = true
"__isla_vector_vpr" = true
"__isla_vector_fpr" = true
"__isla_use_extra_ops" = true
satp = "0x0000000000000000"
misa = "{ bits = 0x800000000034112f }"
mstatus = "{ bits = 0x0000000000000600 }"
mcountinhibit = " { bits = 0x00000000 }"
mcyclecfg = "{ bits = 0x0000000000000000 }"
minstretcfg = "{ bits = 0x0000000000000000 }"
mtimecmp = "0x0000000000000000"
stimecmp = "0x0000000000000000"
__isla_always_aligned = "true"

[const_primops]
get_config_print_reg = false
get_config_print_instr = false
get_config_print_platform = false
get_config_print_mem = false
sys_enable_fdext = false
sys_enable_zfinx = false
sys_enable_rvc = true
sys_enable_next = false
sys_enable_vext = true
sys_enable_writable_fiom = true
sys_enable_writable_misa = true
sys_enable_bext = false
sys_enable_experimental_extensions = false
sys_pmp_count = "0 : %i64"
plat_enable_pmp = false
plat_enable_dirty_update = false
plat_enable_misaligned_access = false
plat_mtval_has_illegal_inst_bits = false
plat_insns_per_tick = 10
plat_ram_base = "0x0000000080000000"
plat_ram_size = "0x0000000004000000"
plat_rom_base = "0x0000000000001000"
plat_rom_size = "0x0000000000000100"
plat_clint_base = "0x0000000002000000"
plat_clint_size = "0x00000000000c0000"
plat_htif_tohost = "0x0000000040001000"
plat_get_16_random_bits = "undefined : %bv16"
plat_term_write = "()"
print_reg = "()"
print_platform = "()"
print_instr = "()"
print_mem_access = "()"
speculate_conditional = "undefined : %bool"
match_reservation = "true"
cancel_reservation = "()"
load_reservation = "()"
csr_full_write_callback = "()"
mem_read_callback = "()"
xreg_full_write_callback = "()"
mem_write_callback = "()"
mem_exception_callback = "()"
pc_write_callback = "()"
get_config_rvfi = "false"
plat_enable_htif = "false"
get_config_use_abi_names = "false"

# === Memory Symbolization Configuration (optional) ===
# Uncomment and configure to enable memory symbolization for RISC-V
#
# CLINT toggle — set to false to disable the CLINT memory region
# clint_enabled = true
#
# Memory regions — define concrete (code/data) and symbolic regions
# [[memory_regions]]
# name = "code"
# base = "0x80000000"
# size = "0x100000"
# region_type = "concrete"
#
# [[memory_regions]]
# name = "symbolic_ram"
# base = "0x80100000"
# size = "0x1000000"
# region_type = "symbolic"
#
# Page table configuration — pre-populate page tables
# [page_table_config]
# mode = "sv39"         # "sv39" or "sv48"
# preset = "identity"   # "identity", "offset", "protected", "symbolic"
# base = "0x300000"     # page table physical base address
# page_size = 4096
# offset = "0x10000000" # only for "offset" preset
#
# Optional: add protected ranges when using the "protected" preset
# protected_ranges = [
# #   { base = "0x80000000", size = "0x1000", flags = "rx" },
# ]
#
# PMP (Physical Memory Protection) configuration
# [pmp]
# symbolic = false
#
# [[pmp.rules]]
# index = 0
# mode = "tor"
# base = "0x80000000"
# permissions = "rw"
# locked = false
#
# [[pmp.rules]]
# index = 1
# mode = "napot"
# base = "0x80200000"
# size = "0x200000"
# permissions = "rwx"
# locked = true

# ZVWABDATYPE 专用局部执行限制。
# 只限制 execute 内计算 widening absolute difference accumulate 的逐 element 循环，
# 不限制循环外 encdec/funct6，也不固定向量运行态或寄存器。
[execution_limits]
strict = true
ir_sha256 = "6fc39efd0f72b0ee8eae247d9965e680b6874f9954334c20d748b42c0987792c"
max_forks_per_branch = 1
on_limit_reached = "concretize"

# 无 workaround 的 60 秒 ITRACE 基线完成 137 条路径后 timeout；循环体
# 156:4-169:5 fork 130 次，其中无符号差值比较 163:25-165:63 fork 107 次，
# 是本 clause 的明确热点。funct6 已由循环外编码分派确定；region 只压重复到达的
# element 计算，不固定 funct6、vm、vl、vstart、vtype 或寄存器。
# 121:1-123:70 的循环外 encdec 不限制。Region 使用半开区间 [155:2,170:3)。
[[execution_limits.region_fork_limits]]
max_forks_per_region = 1
file = "extensions/Zvabd/zvabd_insts.sail"
start_line = 155
start_column = 2
end_line = 170
end_column = 3

# VROR_VV 专用局部执行限制。
# 只限制 execute 内的逐 lane rotate 循环，
# 不固定 vtype、vl、vstart、vm 或寄存器选择，不限制 encdec。
[execution_limits]
strict = true
ir_sha256 = "6fc39efd0f72b0ee8eae247d9965e680b6874f9954334c20d748b42c0987792c"
max_forks_per_branch = 1
on_limit_reached = "concretize"

# 未加限制的 90 秒 ITRACE 基线完成 199 条路径后 timeout，
# 日志持续在 481:4-482:61 由 vl/vstart/vtype/vr0 驱动逐 lane fork。
# 450:37-450:103 是循环外 encdec 扩展条件，特意保持完整符号执行。
# Region 仅为 execute VROR_VV 的 foreach 半开区间 [480:2,483:4)。
[[execution_limits.region_fork_limits]]
max_forks_per_region = 1
file = "extensions/vector_crypto/zvbb_insts.sail"
start_line = 480
start_column = 2
end_line = 483
end_column = 4

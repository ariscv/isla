# VXMCTYPE 专用局部执行限制。
# 只限制 execute 内逐 lane 的 carry/borrow 计算，不固定 funct6、vtype、vl 或 vstart。
[execution_limits]
strict = true
ir_sha256 = "7c626989a03056c43c67c81de8f40f611cef4c43ed1069a81526b37856d7e37b"
max_forks_per_branch = 1
on_limit_reached = "concretize"

# 基线最近 30 秒只增加 19 条完成路径，该循环体却增加 121 次分支。
# 区域为 foreach 内的 mask 判断、funct6 计算与 result 写入，半开区间 [377:4, 383:5)。
[[execution_limits.region_fork_limits]]
max_forks_per_region = 1
file = "extensions/V/vext_vm_insts.sail"
start_line = 377
start_column = 4
end_line = 383
end_column = 5

# VIMCTYPE 专用局部执行限制。
# 只限制 execute 内逐 lane 的 carry 计算，不固定 funct6、vtype、vl 或 vstart。
[execution_limits]
strict = true
ir_sha256 = "6fc39efd0f72b0ee8eae247d9965e680b6874f9954334c20d748b42c0987792c"
max_forks_per_branch = 1
on_limit_reached = "concretize"

# 基线相邻观察点的完成路径从 110 增至 165，该循环体分支却从 293 增至 620。
# 区域为 foreach 内的 if、无 carry-in 加法与 result 写入，半开区间 [640:4, 645:5)。
[[execution_limits.region_fork_limits]]
max_forks_per_region = 1
file = "extensions/V/vext_vm_insts.sail"
start_line = 640
start_column = 4
end_line = 645
end_column = 5

# VVMCTYPE 专用局部执行限制。
# 只限制 execute 内逐 lane 的 carry/borrow 计算，不固定 funct6、vtype、vl 或 vstart。
[execution_limits]
strict = true
ir_sha256 = "6fc39efd0f72b0ee8eae247d9965e680b6874f9954334c20d748b42c0987792c"
max_forks_per_branch = 1
on_limit_reached = "concretize"

# 基线最近 30 秒只增加 26 条完成路径，该循环体却增加 114 次分支。
# 区域为 foreach 内的 mask 判断、funct6 计算与 result 写入，半开区间 [117:4, 123:5)。
[[execution_limits.region_fork_limits]]
max_forks_per_region = 1
file = "extensions/V/vext_vm_insts.sail"
start_line = 117
start_column = 4
end_line = 123
end_column = 5

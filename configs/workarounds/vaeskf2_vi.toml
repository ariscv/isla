# VAESKF2_VI 专用局部执行限制。
# 只限制 execute 内的 element-group 循环，不限制循环外 encdec/立即数语义。
[execution_limits]
strict = true
ir_sha256 = "7c626989a03056c43c67c81de8f40f611cef4c43ed1069a81526b37856d7e37b"
max_forks_per_branch = 1
on_limit_reached = "concretize"

# 90 秒 ITRACE 基线完成 229 条路径后 timeout。
# 主要循环热点为 332:2-347:3；aes_decode_rcon 的多路 match 表达真实轮数，
# 324:2-325:39 表达立即数归一化，均不单独限制。
# 305:38-305:80 是循环外 encdec 合法性条件，不限制，也不固定
# vl/vstart/vtype/rnd/寄存器。Region 使用半开区间 [332:2,347:3)。
[[execution_limits.region_fork_limits]]
max_forks_per_region = 1
file = "extensions/vector_crypto/zvkned_insts.sail"
start_line = 332
start_column = 2
end_line = 347
end_column = 3

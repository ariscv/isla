# MVVCOMPRESS 专用局部执行限制。
# 只限制 execute 内根据 mask 压缩 body elements 的逐 lane 循环，不固定 vtype、vl 或 vstart。
[execution_limits]
strict = true
ir_sha256 = "d0123541491c6ad7cb00d745e751b6a74deac442148fdf95a2488abf6b5e5409"
max_forks_per_branch = 1
on_limit_reached = "concretize"

# 基线 340 条完成路径时，该循环整体到达 340 次，内层 mask 分支已到达 338 次；
# tail loop 未形成分支热点，因此不纳入限制。
[[execution_limits.region_fork_limits]]
max_forks_per_region = 1
file = "extensions/V/vext_arith_insts.sail"
start_line = 2095
start_column = 4
end_line = 2102
end_column = 5

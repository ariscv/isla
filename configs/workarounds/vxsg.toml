# VXSG 专用局部执行限制。
# 只限制 execute 内的逐 lane 循环，不固定 funct6、vtype、vl、vstart 或 rs1。
[execution_limits]
strict = true
ir_sha256 = "7c626989a03056c43c67c81de8f40f611cef4c43ed1069a81526b37856d7e37b"
max_forks_per_branch = 1
on_limit_reached = "concretize"

# 公共非法前导：jump 方向进入 Illegal_Instruction，仅让 1/16 的具体化样本走非法侧。
# 逐 lane 循环已有独立预算，因此继续合法执行不会重新引发循环爆炸。
[[execution_limits.region_fork_limits]]
max_forks_per_region = 1
sample_bias = 16
sample_bias_direction = "jump"
file = "extensions/V/vext_arith_insts.sail"
start_line = 871
start_column = 2
end_line = 876
end_column = 1

[execution_limits.case_quota]
Illegal_Instruction = 2

# slide/gather 三种指令共用的逐 lane foreach，半开区间为 [891:2, 910:1)。
[[execution_limits.region_fork_limits]]
max_forks_per_region = 1
file = "extensions/V/vext_arith_insts.sail"
start_line = 891
start_column = 2
end_line = 910
end_column = 1

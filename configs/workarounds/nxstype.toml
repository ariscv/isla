# NXSTYPE 专用局部执行限制。
# 只限制 execute 内的逐 lane 循环，不固定 funct6、vtype、vl 或 vstart。
[execution_limits]
strict = true
ir_sha256 = "6fc39efd0f72b0ee8eae247d9965e680b6874f9954334c20d748b42c0987792c"
max_forks_per_branch = 1
on_limit_reached = "concretize"

# NXSTYPE 的逐 lane foreach 循环，半开区间为 [737:2, 751:1)。
[[execution_limits.region_fork_limits]]
max_forks_per_region = 1
file = "extensions/V/vext_arith_insts.sail"
start_line = 703
start_column = 2
end_line = 717
end_column = 1

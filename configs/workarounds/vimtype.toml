# VIMTYPE 专用局部执行限制。
# 只限制 execute 内逐 lane 的 carry 计算，不固定 funct6、vtype、vl 或 vstart。
[execution_limits]
strict = true
ir_sha256 = "7c626989a03056c43c67c81de8f40f611cef4c43ed1069a81526b37856d7e37b"
max_forks_per_branch = 1
on_limit_reached = "concretize"

# 基线在完成路径从 211 增至 219 时，该区域的分支已从约 500 增至 636。
# 区域为 foreach 内的 if、进位加法与 result 写入，半开区间 [581:4, 586:5)。
[[execution_limits.region_fork_limits]]
max_forks_per_region = 1
file = "extensions/V/vext_vm_insts.sail"
start_line = 581
start_column = 4
end_line = 586
end_column = 5

# VWSLL_VV 专用局部执行限制。
# 只限制 execute 内的逐 lane widening-shift 循环，不固定运行态，不限制 encdec。
[execution_limits]
strict = true
ir_sha256 = "6fc39efd0f72b0ee8eae247d9965e680b6874f9954334c20d748b42c0987792c"
max_forks_per_branch = 1
on_limit_reached = "concretize"

# 90 秒 ITRACE 基线完成 91 条路径后 timeout。
# 热点 619:4-623:5 位于 execute foreach；580:37-580:103 是循环外 encdec，不限制。
# Region 仅覆盖 foreach 半开区间 [618:2,624:4)。
[[execution_limits.region_fork_limits]]
max_forks_per_region = 1
file = "extensions/vector_crypto/zvbb_insts.sail"
start_line = 618
start_column = 2
end_line = 624
end_column = 4

# VFMV 历史执行限制；当前 run.mk 不再加载本文件。
# 保留旧区域和严格 IR 绑定以追溯原有采样实验，不作现行完整性证据。
# 顶层 max_forks_per_branch 曾作用于整个调用树，不仅限于下方逐 lane 区域。
[execution_limits]
strict = true
ir_sha256 = "d0123541491c6ad7cb00d745e751b6a74deac442148fdf95a2488abf6b5e5409"
max_forks_per_branch = 1
on_limit_reached = "concretize"

# 无 workaround 的 60 秒 ITRACE 在 200 条完成路径内记录到 363 次 1419 行分叉。
# Region 是 foreach 的半开区间 [1418:2,1420:3)，仅覆盖 mask[i] 控制的逐 lane move。
[[execution_limits.region_fork_limits]]
max_forks_per_region = 1
file = "extensions/V/vext_fp_insts.sail"
start_line = 1418
start_column = 2
end_line = 1420
end_column = 3

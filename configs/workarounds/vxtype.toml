# get_fixed_rounding_incr 的 0b11 arm 会判断被丢弃位是否非零。正式运行在
# 1209 条路径后于该比较的 CheckSatAssuming 单次超时；对应 IR 是
# `jump @not(discarded_nonzero)`，target 为直接返回 0 的便宜侧，fallthrough
# 才是 discarded_nonzero=true 的昂贵侧。只让 1/4294967295 的路径采到 fallthrough，
# 同时保留上方无偏置 match 对四种 vxrm 的跨路径采样。
[[execution_limits.region_fork_limits]]
max_forks_per_region = 1
sample_bias = 4294967295
sample_bias_direction = "fallthrough"
file = "extensions/V/vext_utils_insts.sail"
start_line = 741
start_column = 28
end_line = 741
end_column = 72

# sticky_below_rounding 的 IR 在 vxrm=01 arm 中以 `jump sticky_below_rounding`
# 短路 OR；jump 即昂贵的 nonzero=true 侧。正式运行已在 740:11-740:59
# 多次记录单次 SMT timeout，因此以最大 u32 分母压制该侧。
[[execution_limits.region_fork_limits]]
max_forks_per_region = 1
sample_bias = 4294967295
sample_bias_direction = "jump"
file = "extensions/V/vext_utils_insts.sail"
start_line = 740
start_column = 11
end_line = 740
end_column = 59

# vxrm=01 arm 的短路 AND 在 IR 中是 `jump (rounding_bit == 1)` 后才计算

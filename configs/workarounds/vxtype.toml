# VXTYPE 专用局部执行限制。
# 只限制 execute 内证据明确的逐 lane 饱和运算循环与定点舍入 helper，
# 不固定 funct6、vtype、vl、vstart 或寄存器选择，也不覆盖 571 行的 funct6 分派。
[execution_limits]
strict = true
ir_sha256 = "7c626989a03056c43c67c81de8f40f611cef4c43ed1069a81526b37856d7e37b"
max_forks_per_branch = 1
on_limit_reached = "concretize"

# init_masked_result 调用的 vstart 合法上界检查。带现有逐 lane 限制的
# 60 秒 ITRACE 中，该比较仍累计 33 次 fork；最慢的多条已完成路径均在这里
# 花费 23-30 秒后走 Err/Illegal。只限制这个比较，不固定 vstart 的具体值。
[[execution_limits.region_fork_limits]]
max_forks_per_region = 1
file = "extensions/V/vext_utils_insts.sail"
start_line = 282
start_column = 2
end_line = 284
end_column = 24


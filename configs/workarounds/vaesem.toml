# VAESEM 专用局部执行限制。
# 只限制 execute 内的 element-group 循环，不限制循环外 encdec/funct6 分派。
[execution_limits]
strict = true
ir_sha256 = "6fc39efd0f72b0ee8eae247d9965e680b6874f9954334c20d748b42c0987792c"
max_forks_per_branch = 1
on_limit_reached = "concretize"

# 90 秒 ITRACE 基线仅完成 58 条路径后 timeout，并在 aes_mixcolumns_fwd
# 调用链的无源码 bool_bit_forwards（IR pc 1062）发生 17 次 fork。
# VAESEM 自身 ITRACE 显示 foreach 入口为 jump @gt(...)，jump 目标直接到循环后
# 收尾，故 jump=退出、fallthrough=进入昂贵的 MixColumns。
# 使用 256:1 fallthrough 偏置，仅抽样极少量进入循环的路径。
# 196:38-197:49 是循环外 encdec/funct6 合法性条件，不限制，也不固定
# vl/vstart/vtype/vm/寄存器。Region 使用半开区间 [217:2,231:3)。
[[execution_limits.region_fork_limits]]
max_forks_per_region = 1
sample_bias = 256
sample_bias_direction = "fallthrough"
file = "extensions/vector_crypto/zvkned_insts.sail"
start_line = 217
start_column = 2
end_line = 231
end_column = 3

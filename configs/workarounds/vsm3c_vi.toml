# VSM3C_VI 专用局部执行限制。
# 只限制 execute 内的 element-group 循环，不限制循环外 encdec。
[execution_limits]
strict = true
ir_sha256 = "7c626989a03056c43c67c81de8f40f611cef4c43ed1069a81526b37856d7e37b"
max_forks_per_branch = 1
on_limit_reached = "concretize"

# 90 秒 ITRACE 基线仅完成 39 条路径后 timeout。
# 本 clause 热点为 88:2-102:3 的 element-group foreach；SM3 helper 仅少量分派。
# 64:36-66:128 是循环外 encdec，不限制，也不固定运行态、立即数或寄存器。
# Region 使用半开区间 [88:2,102:3)。
[[execution_limits.region_fork_limits]]
max_forks_per_region = 1
file = "extensions/vector_crypto/zvksh_insts.sail"
start_line = 88
start_column = 2
end_line = 102
end_column = 3

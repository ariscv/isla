# VROL_VX 专用局部执行限制。
# 只限制 execute 内的逐 lane rotate 循环，
# 不固定 vtype、vl、vstart、vm 或寄存器选择，不限制 encdec。
[execution_limits]
strict = true
ir_sha256 = "7c626989a03056c43c67c81de8f40f611cef4c43ed1069a81526b37856d7e37b"
max_forks_per_branch = 1
on_limit_reached = "concretize"

# 未加限制的 90 秒 ITRACE 基线完成 154 条路径后 timeout，
# 日志持续在 437:4-438:58 由 vl/vstart/vtype/vr0 驱动逐 lane fork。
# 407:37-407:103 是循环外 encdec 扩展条件，特意保持完整符号执行。
# Region 仅为 execute VROL_VX 的 foreach 半开区间 [436:2,439:4)。
[[execution_limits.region_fork_limits]]
max_forks_per_region = 1
file = "extensions/vector_crypto/zvbb_insts.sail"
start_line = 436
start_column = 2
end_line = 439
end_column = 4

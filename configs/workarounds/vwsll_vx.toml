# VWSLL_VX 专用局部执行限制。
# 只限制 execute 内的逐 lane widening-shift 循环，不限制循环外 encdec。
[execution_limits]
strict = true
ir_sha256 = "d0123541491c6ad7cb00d745e751b6a74deac442148fdf95a2488abf6b5e5409"
max_forks_per_branch = 1
on_limit_reached = "concretize"

# 90 秒 ITRACE 基线完成 153 条路径后 timeout。
# 热点为 673:4-676:5；635:37-635:103 是循环外 encdec，不限制。
# Region 仅覆盖 foreach 半开区间 [672:2,677:4)。
[[execution_limits.region_fork_limits]]
max_forks_per_region = 1
file = "extensions/vector_crypto/zvbb_insts.sail"
start_line = 672
start_column = 2
end_line = 677
end_column = 4

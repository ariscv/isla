# VAESDM 专用局部执行限制。
# 只限制 execute 内的 element-group 循环，不限制循环外 encdec/funct6 分派。
[execution_limits]
strict = true
ir_sha256 = "6fc39efd0f72b0ee8eae247d9965e680b6874f9954334c20d748b42c0987792c"
max_forks_per_branch = 1
on_limit_reached = "concretize"

# 90 秒 ITRACE 基线仅完成 58 条路径后 timeout。
# 热点包含 100:2-114:3 的 element-group foreach；79:38-80:49 是循环外
# encdec/funct6 合法性条件，不限制，也不固定 vl/vstart/vtype/vm/寄存器。
# ITRACE 显示 foreach 入口 jump 的 jump 方向直接退出循环；fallthrough 会进入
# aes_mixcolumns_inv，并在无源码位置的 bool_bit_forwards 首次 fork 上形成分钟级 SMT。
# 使用 256:1 fallthrough 偏置，仅抽样极少量进入循环的路径，其余从 jump 方向退出。
# Region 使用半开区间 [100:2,114:3)。
[[execution_limits.region_fork_limits]]
max_forks_per_region = 1
sample_bias = 256
sample_bias_direction = "fallthrough"
file = "extensions/vector_crypto/zvkned_insts.sail"
start_line = 100
start_column = 2
end_line = 114
end_column = 3

# VSM4K_VI 专用局部执行限制。
# 只限制 execute 内的 element-group 循环，不限制循环外 encdec。
[execution_limits]
strict = true
ir_sha256 = "6fc39efd0f72b0ee8eae247d9965e680b6874f9954334c20d748b42c0987792c"
max_forks_per_branch = 1
on_limit_reached = "concretize"

# 90 秒 ITRACE 基线仅完成 36 条路径后 timeout。
# 热点为 37:2-61:3 的 element-group foreach，未观察到独立 SM4 helper fork 热点。
# 14:38-16:80 是循环外 encdec，不限制，也不固定运行态/立即数/寄存器。
# Region 使用半开区间 [37:2,61:3)。
[[execution_limits.region_fork_limits]]
max_forks_per_region = 1
file = "extensions/vector_crypto/zvksed_insts.sail"
start_line = 37
start_column = 2
end_line = 61
end_column = 3

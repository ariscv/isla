# NITYPE 专用局部执行限制。
# 只限制逐 lane 循环和 rounding helper，不固定 vtype、vl 或 vstart。
[execution_limits]
strict = true
ir_sha256 = "d0123541491c6ad7cb00d745e751b6a74deac442148fdf95a2488abf6b5e5409"
max_forks_per_branch = 1
on_limit_reached = "concretize"

# fixed-point rounding helper 的多路 match。
[[execution_limits.region_fork_limits]]
max_forks_per_region = 1
file = "extensions/V/vext_utils_insts.sail"
start_line = 612
start_column = 2
end_line = 634
end_column = 1

# NITYPE 的逐 lane foreach 循环，半开区间为 [1273:2, 1289:1)。
[[execution_limits.region_fork_limits]]
max_forks_per_region = 1
file = "extensions/V/vext_arith_insts.sail"
start_line = 1239
start_column = 2
end_line = 1255
end_column = 1

# VCLMUL_VV 专用局部执行限制。
# 只限制 execute 内逐 lane 的 mask/carryless-multiply 循环，
# 不固定 vtype、vl、vstart、vm 或寄存器选择，也不限制 encdec。
[execution_limits]
strict = true
ir_sha256 = "7c626989a03056c43c67c81de8f40f611cef4c43ed1069a81526b37856d7e37b"
max_forks_per_branch = 1
on_limit_reached = "concretize"

# 独立 60 秒 ITRACE 基线完成 174 条路径，日志持续在 45:4-48:5 因
# mask（由 vl/vstart/vtype/vr0 共同决定）逐 lane fork；活跃 lane 随后调用
# 昂贵的 carryless_mul。Region 为 execute VCLMUL_VV 的 foreach 半开区间
# [44:2,49:4)，循环外合法性检查及 encdec 保持完整符号执行。
[[execution_limits.region_fork_limits]]
max_forks_per_region = 1
file = "extensions/vector_crypto/zvbc_insts.sail"
start_line = 44
start_column = 2
end_line = 49
end_column = 4

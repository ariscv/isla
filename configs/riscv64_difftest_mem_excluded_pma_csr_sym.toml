# This is a config for Sail RISC-V in 64-bit mode
# 在 riscv64_difftest_mem_excluded_pma.toml 基础上演示 W21 CSR 符号化：
#   - mstatus 从 [registers.defaults] 摘除（0x600=VS Dirty/FS Off），改挂
#     [symbolic_registers.mstatus]：solver 期符号注入 + 位级钉死 + 位组域约束；
#   - 其余与 _excluded_pma 逐字一致（memory_regions / pma_regions / PMP 钉死）。
# 效果（G8 根因的修复）：encdec/assembly 物化门按当前路径模型的 mstatus 评估
# currentlyEnabled(Ext_Zcd)，FS≠0 路径可物化 C_FLD/C_FSD/C_FLDSP/C_FSDSP。

pc = "PC"

zero_announce_exit = true

default_sizeof = 4

in_program_order = ["sail_barrier"]

# CLINT [0x02000000,0x020c0000) 落在下方 mmio_hole 判死段内，区域不允许
# 重叠，必须关闭（顶层键须写在任何 [table]/[[array]] 表头之前）
clint_enabled = false

# 执行限制不再放在通用 ISA 配置中。需要时由命令行
# --execution-limits-config 加载 configs/workarounds/ 下的独立 TOML。

[[toolchain]]
name = "macos-riscv64"
os = "macos"
arch = "aarch64"
assembler = "riscv64-elf-as"
objdump = "riscv64-elf-objdump"
nm = "riscv64-elf-nm"
linker = "riscv64-elf-ld"

[[toolchain]]
name = "default"
assembler = "riscv64-linux-gnu-as -march=rv64imac"
objdump = "riscv64-linux-gnu-objdump"
linker = "riscv64-linux-gnu-ld"
nm = "riscv64-linux-gnu-nm"

# Currently not used for RISC-V
[mmu]
page_table_base = "0x300000"
page_size = "4096"
s2_page_table_base = "0x300000"
s2_page_size = "4096"

[threads]
base = "0x80100000"
top = "0x80300000"
stride = "0x10000"

[symbolic_addrs]
base = "0x80310000"
top = "0x80410000"
stride = "0x10"

[registers]

# W21：mstatus 已从 defaults 摘除，改挂 [symbolic_registers.mstatus]。
[registers.defaults]
"__isla_vector_gpr" = true
"__isla_vector_vpr" = true
"__isla_vector_fpr" = true
"__isla_use_extra_ops" = true
satp = "0x0000000000000000"
misa = "{ bits = 0x800000000034112f }"
mcountinhibit = " { bits = 0x00000000 }"
mcyclecfg = "{ bits = 0x0000000000000000 }"
minstretcfg = "{ bits = 0x0000000000000000 }"
mtimecmp = "0x0000000000000000"
stimecmp = "0x0000000000000000"
__isla_always_aligned = "true"
# W14（②）：PMP 关闭态钉死。IR 中 PMP 是族寄存器（rv64d.ir）：
#   register zpmpcfg_n  : %fvec(64, %struct zPmpcfg_ent)   （zbits: %bv8）
#   register zpmpaddr_n : %fvec(64, %bv64)
# 未给默认值时二者在 solve-state 初始状态为符号变量，pmpCheck 可走"PMP 拒绝"
# 分支产出图内假 AccessFault（W13 c015/c030，green 全量 107/2479 同因）。
# 注意：不能全部钉 A=OFF——IR 里 let sys_pmp_count = 16（config_primop 的
# sys_pmp_count=0 是死配置，它是 let 不是 primop），pmpControl 循环结构性
# 生效，全 OFF 空匹配后 U/S 态 fallthrough 必产 AccessFault（pmp_control.sail
# 循环尾部 priv == Machine ? None : Some(AccessFault)）。故钉 NAPOT-全1-RWX
# （cfg 字节 0x1f = L0|A=11|RWX，addr 全 1 → entry0 匹配全地址空间），与 emu
# 重放侧（pmpaddr0=-1/pmpcfg0=0x1f）语义一致，pmpCheck 恒 None。
"pmpcfg_n" = "[ { bits = 0x1f } ; 64 ]"
"pmpaddr_n" = "[ 0xffffffffffffffff ; 64 ]"

# === W21：CSR 符号化声明 ===
# mstatus 结构为 struct zMstatus { zbits: %bv64 }（rv64d.ir:3310），注入按
# 64 位平铺位向量处理。用户原则：无探索意义的位钉死，其余符号。
#   - pin_mask/pin_value（位级钉死，注入后断言 (sym & mask) == value）：
#     * SD(bit63)=0：只读状态镜像（SD = FS|XS|VS dirty 投影），pre-state 钉
#       "初始非脏"与执行期 dirty 更新语义一致，符号化无探索意义；
#     * MBE(bit37)=0 / SBE(bit36)=0：大小端必须小端——模型与 emu 重放均 LE，
#       符号化只开 BE 分支噪声，重放不可比。
#   - nonzero_groups（位组非全零域约束）：FS[14:13]≠Off。solve-state 绕过
#     decode，clause execute 本体不读 FS（G8：路径 24 AF+8 成功与整数同型），
#     纯符号时模型任意值取 0 会让 encdec 守卫 currentlyEnabled(Ext_Zcd) 恒假；
#     把 FS≠0 声明为取值域是 decode 守卫语义的最小复刻，FS=00 本就会被
#     encdec 物化门丢弃（合法路径不丢）。
#   - 其余位（MIE/MPIE/SIE/SPIE/MPP/SPP/MPRV/MXR/SUM/TVM/TSR/TW/UXL/SXL/
#     VS/XS/WPRI…）保持符号：MPP 影响特权态迁移、MPRV 开 M 态翻译语义、
#     VS 开 V 上下文分支，均有探索价值（分布影响见 W21 对照记录）。
[symbolic_registers.mstatus]
pin_mask = "0x8000003000000000"
pin_value = "0x0"
nonzero_groups = [[13, 14]]

[const_primops]
get_config_print_reg = false
get_config_print_instr = false
get_config_print_platform = false
get_config_print_mem = false
sys_enable_fdext = false
sys_enable_zfinx = false
sys_enable_rvc = true
sys_enable_next = false
sys_enable_vext = true
sys_enable_writable_fiom = true
sys_enable_writable_misa = true
sys_enable_bext = false
sys_enable_experimental_extensions = false
sys_pmp_count = "0 : %i64"
plat_enable_pmp = false
plat_enable_dirty_update = false
plat_enable_misaligned_access = false
plat_mtval_has_illegal_inst_bits = false
plat_insns_per_tick = 10
plat_ram_base = "0x0000000080000000"
plat_ram_size = "0x0000000004000000"
plat_rom_base = "0x0000000000001000"
plat_rom_size = "0x0000000000000100"
plat_clint_base = "0x0000000002000000"
plat_clint_size = "0x00000000000c0000"
plat_htif_tohost = "0x0000000040001000"
plat_get_16_random_bits = "undefined : %bv16"
plat_term_write = "()"
print_reg = "()"
print_platform = "()"
print_instr = "()"
print_mem_access = "()"
speculate_conditional = "undefined : %bool"
match_reservation = "true"
cancel_reservation = "()"
load_reservation = "()"
csr_full_write_callback = "()"
mem_read_callback = "()"
xreg_full_write_callback = "()"
mem_write_callback = "()"
mem_exception_callback = "()"
pc_write_callback = "()"
get_config_rvfi = "false"
plat_enable_htif = "false"
get_config_use_abi_names = "false"

# === Memory Symbolization Configuration（同 _excluded_pma） ===
[[memory_regions]]
name = "code"
base = "0x0"
size = "0x1000"
region_type = "concrete"

[[memory_regions]]
name = "sym_ram"
base = "0x80000000"
size = "0x10000000"
region_type = "symbolic"

[[memory_regions]]
name = "mmio_hole"
base = "0x02000000"
size = "0x02000000"
region_type = "excluded"

# === W10（S1）：配置化 PMA 地图（同 _excluded_pma，RAM 8TB 顶界） ===
[[pma_regions]]
name = "ram"
base = "0x80000000"
size = "0x7FF80000000"
attr = "ram"

# This is a config for Sail RISC-V in 64-bit mode

pc = "PC"

# No ifetch semantics for RISC-V
ifetch = "Read_ifetch"

read_exclusives = ["Read_RISCV_reserved", "Read_RISCV_reserved_acquire", "Read_RISCV_reserved_strong_acquire"]
write_exclusives = ["Write_RISCV_conditional", "Write_RISCV_conditional_release", "Write_RISCV_conditional_strong_release"]

assembler = "riscv64-unknown-elf-as -march=rv64imac"
objdump = "riscv64-unknown-elf-objdump"
linker = "riscv64-unknown-elf-ld"

# Currently not used for RISC-V
[mmu]
page_table_base = "0x300000"
page_size = "4096"
s2_page_table_base = "0x300000"
s2_page_size = "4096"

[threads]
base = "0x80100000"
top = "0x80300000"
stride = "0x10000"

[symbolic_addrs]
base = "0x80310000"
top = "0x80410000"
stride = "0x10"

[registers.defaults]
"__isla_use_extra_ops" = true
rv_enable_writable_misa = true
rv_enable_rvc = true
rv_enable_fdext = false
rv_enable_pmp = false
rv_enable_dirty_update = false
rv_enable_misaligned_access = false
rv_mtval_has_illegal_inst_bits = false
rv_ram_base = "0x0000000080000000"
rv_ram_size = "0x0000000004000000"
rv_rom_base = "0x0000000000001000"
rv_rom_size = "0x0000000000000100"
rv_clint_base = "0x0000000002000000"
rv_clint_size = "0x00000000000c0000"
rv_htif_tohost = "0x0000000080001000"
rv_insns_per_tick = 10

[reads]
Read_RISCV_acquire = "A"
Read_RISCV_strong_acquire = "A"
Read_RISCV_reserved = "X"
Read_RISCV_reserved_acquire = ["A", "X"]
Read_RISCV_reserved_strong_acquire = ["A", "X"]

[writes]
Write_RISCV_release = "L"
Write_RISCV_strong_release = "L"
Write_RISCV_conditional = "X"
Write_RISCV_conditional_release = ["L", "X"]
Write_RISCV_conditional_strong_release = ["L", "X"]

[cache_ops]

[barriers]
Barrier_RISCV_rw_rw = "Fence.rw.rw"
Barrier_RISCV_r_rw = "Fence.r.rw"
Barrier_RISCV_r_r = "Fence.r.r"
Barrier_RISCV_rw_w = "Fence.rw.w"
Barrier_RISCV_w_w = "Fence.w.w"
Barrier_RISCV_w_rw = "Fence.w.rw"
Barrier_RISCV_rw_r = "Fence.rw.r"
Barrier_RISCV_r_w = "Fence.r.w"
Barrier_RISCV_w_r = "Fence.w.r"
Barrier_RISCV_tso = "Fence.tso"
Barrier_RISCV_i = "Fence.i"

[const_primops]
sys_enable_experimental_extensions = false

# 初态合法域由配置声明。本批模型能力为 S=true、U=true、H=false。
# Sail：model/core/types.sail:70-85；model/core/sys_regs.sail:284-294（不支持虚拟特权级）。
[symbolic_registers.cur_privilege]
allowed = ["Machine", "Supervisor", "User"]

[constraints]
initial = [
    # Sail：model/core/sys_regs.sail:179-180,259-266，RV64 的 SXL/UXL 固定为 0b10。
    "= ((_ extract 35 34) mstatus.bits) #b10",
    "= ((_ extract 33 32) mstatus.bits) #b10",
    # Sail：model/core/sys_regs.sail:159-166,237,259-266；MPP 为 U/S/M，保留 reset 的 0。
    "or (= ((_ extract 12 11) mstatus.bits) #b00) (= ((_ extract 12 11) mstatus.bits) #b01) (= ((_ extract 12 11) mstatus.bits) #b11)",
    # Sail：model/extensions/V/vext_regs.sail:317-334；vext_vset_insts.sail:95-133。
    # 普通域：VLEN=128、ELEN=64，SEW<=LMUL*64，vl<=LMUL*128/SEW；vta/vma 保持自由。
    # vill 域：vext_vset_insts.sail:52-62，仅 vill=1 且 vl=0，与普通域取并集。
    """or
      (and (bvule vtype.bits #x00000000000000ff) (or
        (and (= (bvand vtype.bits #x000000000000003f) #x0000000000000000) (bvule vl #x0000000000000010))
        (and (= (bvand vtype.bits #x000000000000003f) #x0000000000000001) (bvule vl #x0000000000000020))
        (and (= (bvand vtype.bits #x000000000000003f) #x0000000000000002) (bvule vl #x0000000000000040))
        (and (= (bvand vtype.bits #x000000000000003f) #x0000000000000003) (bvule vl #x0000000000000080))
        (and (= (bvand vtype.bits #x000000000000003f) #x0000000000000005) (bvule vl #x0000000000000002))
        (and (= (bvand vtype.bits #x000000000000003f) #x0000000000000006) (bvule vl #x0000000000000004))
        (and (= (bvand vtype.bits #x000000000000003f) #x0000000000000007) (bvule vl #x0000000000000008))
        (and (= (bvand vtype.bits #x000000000000003f) #x0000000000000008) (bvule vl #x0000000000000008))
        (and (= (bvand vtype.bits #x000000000000003f) #x0000000000000009) (bvule vl #x0000000000000010))
        (and (= (bvand vtype.bits #x000000000000003f) #x000000000000000a) (bvule vl #x0000000000000020))
        (and (= (bvand vtype.bits #x000000000000003f) #x000000000000000b) (bvule vl #x0000000000000040))
        (and (= (bvand vtype.bits #x000000000000003f) #x000000000000000e) (bvule vl #x0000000000000002))
        (and (= (bvand vtype.bits #x000000000000003f) #x000000000000000f) (bvule vl #x0000000000000004))
        (and (= (bvand vtype.bits #x000000000000003f) #x0000000000000010) (bvule vl #x0000000000000004))
        (and (= (bvand vtype.bits #x000000000000003f) #x0000000000000011) (bvule vl #x0000000000000008))
        (and (= (bvand vtype.bits #x000000000000003f) #x0000000000000012) (bvule vl #x0000000000000010))
        (and (= (bvand vtype.bits #x000000000000003f) #x0000000000000013) (bvule vl #x0000000000000020))
        (and (= (bvand vtype.bits #x000000000000003f) #x0000000000000017) (bvule vl #x0000000000000002))
        (and (= (bvand vtype.bits #x000000000000003f) #x0000000000000018) (bvule vl #x0000000000000002))
        (and (= (bvand vtype.bits #x000000000000003f) #x0000000000000019) (bvule vl #x0000000000000004))
        (and (= (bvand vtype.bits #x000000000000003f) #x000000000000001a) (bvule vl #x0000000000000008))
        (and (= (bvand vtype.bits #x000000000000003f) #x000000000000001b) (bvule vl #x0000000000000010))))
      (and (= vtype.bits #x8000000000000000) (= vl #x0000000000000000))""",
]
